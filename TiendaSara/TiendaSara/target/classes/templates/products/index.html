<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center mb-4">Products</h2>

    <a class="btn btn-primary mb-3" th:href="@{/products/create}">Create Product</a>
    <a class="btn btn-outline-secondary mb-3" th:href="@{/index.html}">Inicio</a>

    <table class="table align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Description</th>
          <th>Price</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Mark</th>
          <th>Image</th>
          <th>Created At</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="product : ${products}">
          <td th:text="${product.id}"></td>
          <td th:text="${product.description}"></td>
          <td th:text="${product.price}"></td>
          <td th:text="${product.amount}"></td>
          <td th:text="${product.category != null ? product.category.description : ''}"></td>
          <td th:text="${product.mark != null ? product.mark.description : ''}"></td>
          <td>
            <img th:if="${product.imageFileName != null}"
                 th:src="@{'/images/' + ${product.imageFileName}}"
                 width="100" alt="Imagen">
          </td>
          <td th:text="${product.createdAt != null ? #dates.format(product.createdAt, 'yyyy-MM-dd') : ''}"></td>
          <td>
            <a class="btn btn-primary btn-sm" th:href="@{/products/edit(id=${product.id})}">Edit</a>
            <a class="btn btn-danger btn-sm" th:href="@{/products/delete(id=${product.id})}"
               onclick="return confirm('Eliminar este producto?')">Delete</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
